<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>心理咨询师基础培训考试备考门户 - 登录</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 380px; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; font-weight: 500; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #666; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; transition: border 0.3s; }
        .input-group input:focus { border-color: #45B39D; outline: none; }
        .btn-login { width: 100%; padding: 12px; background: #45B39D; border: none; color: white; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-login:hover { background: #389280; }
        .footer-link { text-align: center; margin-top: 15px; font-size: 12px; color: #999; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>备考门户登录</h2>
    <form id="loginForm">
        <div class="input-group">
            <label>手机号</label>
            <input type="tel" id="phone" placeholder="请输入注册手机号" required pattern="[0-9]{11}">
        </div>
        <div class="input-group">
            <label>身份证号</label>
            <input type="text" id="idCard" placeholder="请输入18位身份证号" required>
        </div>
        <div class="input-group">
            <label>准考密码 (6位大写字母)</label>
            <input type="text" id="password" placeholder="请输入6位大写字母密码" required 
                   minlength="6" maxlength="6" style="text-transform: uppercase;">
        </div>
        <button type="submit" class="btn-login">登录系统</button>
    </form>
    <div class="footer-link">
        <p>© 心理咨询师培训备考系统 - 2026</p>
    </div>
</div>

<script>
    document.getElementById('loginForm').onsubmit = function(e) {
        e.preventDefault();
        const phone = document.getElementById('phone').value;
        const idCard = document.getElementById('idCard').value;
        const password = document.getElementById('password').value.toUpperCase(); // 强制转大写传参

        const targetUrl = `dashboard.html?phone=${encodeURIComponent(phone)}&idCard=${encodeURIComponent(idCard)}&password=${encodeURIComponent(password)}`;
        window.location.href = targetUrl;
    };
</script>

</body>
</html>
